<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gladiador Rojo - Final Battle</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;}
  body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;width:100vw;display:flex;flex-direction:column;}
  #topBar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:linear-gradient(180deg,#1a1a1a,#000);border-bottom:2px solid #c89b3c;z-index:10;}
  .fighterInfo{display:flex;flex-direction:column;gap:4px;width:42%;}
  .name{font-weight:900;font-size:13px;letter-spacing:1px;}
  .name.rojo{color:#ff4444;} .name.azul{color:#44aaff;}
  .hpWrap{background:#222;height:18px;border-radius:10px;border:1.5px solid #c89b3c;overflow:hidden;}
  .hp{height:100%;transition:width 0.2s;}
  .hp.rojo{background:linear-gradient(90deg,#ff0000,#ff8a00);}
  .hp.azul{background:linear-gradient(90deg,#0066ff,#00ffcc);}
  #levelBadge{background:#c89b3c;color:#000;font-weight:900;padding:4px 12px;border-radius:20px;font-size:12px;}
  #gameWrap{flex:1;position:relative;background:radial-gradient(ellipse at center bottom,#4a2c0a 0%,#1e0f00 60%,#0a0a0a 100%);overflow:hidden;}
  canvas{width:100%;height:100%;display:block;}
  #effectText{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-size:42px;font-weight:900;color:#ffcc00;text-shadow:0 0 20px #ff0000, 4px 4px 0 #000;opacity:0;pointer-events:none;z-index:5;transition:all 0.2s;}
  #controls{position:absolute;bottom:0;left:0;right:0;height:46%;display:flex;justify-content:space-between;align-items:flex-end;padding:10px 10px 14px 10px;background:linear-gradient(0deg,rgba(0,0,0,0.9) 0%, transparent 100%);z-index:4;}
  .side{display:flex;flex-direction:column;gap:8px;}
  .row{display:flex;gap:8px;justify-content:center;}
  .btn{width:58px;height:58px;background:linear-gradient(145deg,#222,#111);border:2px solid #c89b3c;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;color:#ffd700;box-shadow:0 4px 0 #000;cursor:pointer;}
  .btn:active{transform:translateY(4px);background:#c89b3c;color:#000;}
  .btn.attack{width:78px;height:78px;font-size:26px;background:linear-gradient(145deg,#331111,#220000);border-color:#ff4444;}
  .btn.kick{background:linear-gradient(145deg,#332200,#221100);border-color:#ffaa00;}
  #winScreen{position:absolute;inset:0;background:rgba(0,0,0,0.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px;}
  #winScreen h1{font-size:42px;color:#ffd700;margin-bottom:10px;}
  #winScreen button{padding:12px 28px;background:#c89b3c;color:#000;border:none;border-radius:30px;font-weight:900;font-size:16px;}
</style>
</head>
<body>
<div id="topBar">
  <div class="fighterInfo">
    <div class="name rojo">⚔️ ROJO - TU</div>
    <div class="hpWrap"><div id="hpRed" class="hp rojo" style="width:100%"></div></div>
  </div>
  <div id="levelBadge">NIVEL 1</div>
  <div class="fighterInfo" style="align-items:flex-end">
    <div class="name azul">ENEMIGO AZUL</div>
    <div class="hpWrap" style="width:100%"><div id="hpBlue" class="hp azul" style="width:100%"></div></div>
  </div>
</div>
<div id="gameWrap">
  <canvas id="c"></canvas>
  <div id="effectText">¡CRITICO!</div>
  <div id="controls">
    <div class="side">
      <div class="row"><div class="btn" data-k="w">▲</div></div>
      <div class="row"><div class="btn" data-k="a">◀</div><div class="btn" data-k="s">▼</div><div class="btn" data-k="d">▶</div></div>
    </div>
    <div class="side">
      <div class="row">
        <div class="btn attack" data-k="p">👊<span style="font-size:10px">GOLPE</span></div>
        <div class="btn attack kick" data-k="k">🦶<span style="font-size:10px">PATADA</span></div>
      </div>
    </div>
  </div>
  <div id="winScreen">
    <h1 id="winTitle">¡VICTORIA!</h1>
    <p id="winDesc"></p>
    <button onclick="nextLevel()">SIGUIENTE NIVEL →</button>
  </div>
</div>
