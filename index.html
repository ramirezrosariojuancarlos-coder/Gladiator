<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gladiador Rojo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#000;height:100vh;display:flex;flex-direction:column;font-family:Arial}
#bar{height:50px;background:#111;border-bottom:2px solid gold;display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:#fff}
.hp{height:14px;background:#333;border-radius:7px;overflow:hidden;margin-top:2px;width:120px;border:1px solid gold}
.hp div{height:100%;transition:0.2s}
#r div{background:linear-gradient(90deg,red,orange)}#b div{background:linear-gradient(90deg,blue,cyan)}
#arena{flex:1;position:relative;background:radial-gradient(#4a2a0a,#0a0000);overflow:hidden}
#arena canvas{width:100%;height:100%}
#ctrl{height:140px;background:rgba(0,0,0,0.9);display:flex;justify-content:space-between;padding:10px}
.btn{width:60px;height:60px;background:#222;border:2px solid gold;border-radius:12px;color:gold;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold}
.btn:active{background:gold;color:#000}
.big{width:80px;height:80px;font-size:14px;flex-direction:column}
#msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:40px;font-weight:900;color:yellow;text-shadow:2px 2px 0 #000;opacity:0;pointer-events:none;z-index:10}
</style>
</head>
<body>
<div id="bar">
<div><b style="color:#ff4444">ROJO TU</b><div class="hp" id="r"><div id="hR" style="width:100%"></div></div></div>
<div style="background:gold;color:#000;padding:4px 12px;border-radius:12px;font-weight:900" id="lv">NIVEL 1</div>
<div style="text-align:right"><b style="color:#44aaff">AZUL</b><div class="hp" id="b"><div id="hB" style="width:100%"></div></div></div>
</div>
<div id="arena">
<canvas id="c"></canvas>
<div id="msg">GOLPE!</div>
<div id="ctrl">
<div style="display:flex;gap:8px;align-items:flex-end"><div class="btn" id="L">◀</div><div style="display:flex;flex-direction:column;gap:8px"><div class="btn" id="U">▲</div><div class="btn" id="D">▼</div></div><div class="btn" id="R">▶</div></div>
<div style="display:flex;gap:10px;align-items:flex-end"><div class="btn big" id="P" style="border-color:red;background:#331111">👊<span style="font-size:10px">GOLPE</span></div><div class="btn big" id="K" style="border-color:orange;background:#332200">🦶<span style="font-size:10px">PATADA</span></div></div>
</div>
</div>
<script>
let can=document.getElementById('c'),ctx=can.getContext('2d'),W,H;
function sz(){W=can.width=can.offsetWidth;H=can.height=can.offsetHeight-140}
window.onresize=sz;sz();
let lvl=1,red={x:100,y:0,hp:100,max:110,vx:0,face:1,at:0,ht:0},blue={x:300,hp:100,max:100,vx:0,face:-1,at:0,ai:0,ht:0},parts=[],shake=0,key={};
function reset(){red.max=100+lvl*10;red.hp=red.max;blue.max=80+lvl*20;blue.hp=blue.max;red.x=W*0.25;blue.x=W*0.75;red.y=0;update()}
function update(){document.getElementById('hR').style.width=red.hp/red.max*100+'%';document.getElementById('hB').style.width=blue.hp/blue.max*100+'%';document.getElementById('lv').innerText='NIVEL '+lvl}
function addP(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-0.5)*12,vy:-Math.random()*8-2,life:1,c})}
function msg(t){let m=document.getElementById('msg');m.innerText=t;m.style.opacity=1;setTimeout(()=>m.style.opacity=0,400)}
function doHit(a,d,type){if(a.at>0)return;a.at=type=='k'?30:20;setTimeout(()=>{if(Math.abs(a.x-d.x)<90){let dmg=type=='k'?22:14;if(Math.random()<0.3){dmg*=1.5;msg('CRITICO!');shake=12} d.hp-=dmg;d.ht=12;d.vx+=a.face*(type=='k'?12:6);addP(d.x,H*0.6,'red',15);update();if(d.hp<=0){if(d==blue){alert('GANASTE NIVEL '+lvl);lvl++;if(lvl>5){alert('CAMPEON!');lvl=1}reset()}else{alert('PERDISTE');lvl=1;reset()}}}},type=='k'?180:100)}
function loop(){
requestAnimationFrame(loop);
red.vx*=0.8;if(key.l){red.vx=-5;red.face=-1}if(key.r){red.vx=5;red.face=1}if(key.u)red.y=Math.max(-80,red.y-4);if(key.d)red.y=Math.min(30,red.y+4);red.x+=red.vx;
blue.ai--;if(blue.ai<=0){let dif=red.x-blue.x;if(Math.abs(dif)<80)doHit(blue,red,Math.random()<0.5?'p':'k');else blue.vx=Math.sign(dif)*(1.5+lvl*0.4);blue.ai=30+Math.random()*30}
blue.vx*=0.85;blue.x+=blue.vx;blue.face=red.x>blue.x?1:-1;
if(red.at>0)red.at--;if(blue.at>0)blue.at--;if(red.ht>0)red.ht--;if(blue.ht>0)blue.ht--;
red.x=Math.max(20,Math.min(W-20,red.x));blue.x=Math.max(20,Math.min(W-20,blue.x));
ctx.save();if(shake>0){ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);shake*=0.9}
ctx.clearRect(0,0,W,H);
// fondo
ctx.fillStyle=lvl==1?'#2a1a05':lvl==2?'#1a1230':lvl==3?'#0a2230':'#301010';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#e8c87a';ctx.fillRect(0,H*0.7,W,H*0.3);
// gladiadores - DIBUJO GIGANTE Y VISIBLE
function draw(f,isRed){
ctx.save();ctx.translate(f.x,H*0.7+f.y);ctx.scale(f.face,1);
if(f.ht%2==0||f.ht==0){}else ctx.globalAlpha=0.4;
// sombra
ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-25,35,50,8);
// piernas
ctx.fillStyle=isRed?'#900':'#003399';ctx.fillRect(-20,0,18,35);ctx.fillRect(2,0,18,35);
// cuerpo
ctx.fillStyle=isRed?'#ff0000':'#0066ff';ctx.fillRect(-22,-40,44,40);
// casco
ctx.fillStyle='#888';ctx.fillRect(-18,-65,36,28);ctx.fillStyle='#222';ctx.fillRect(-16,-50,32,5);
// cara
ctx.fillStyle='#ffdbac';ctx.fillRect(-12,-48,24,14);
// brazo golpeando
ctx.fillStyle='#ffdbac';let ax=f.at>10?30:12;ctx.fillRect(ax,-35, f.at>10?35:18,12);if(f.at>10){ctx.fillStyle=isRed?'#ff4400':'#00aaff';ctx.beginPath();ctx.arc(ax+35,-29,12,0,6.28);ctx.fill()}
ctx.restore();
}
draw(blue,false);draw(red,true);
parts.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.4;p.life-=0.03;if(p.life<=0)parts.splice(i,1);else{ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,6,6)}});
ctx.restore();
}
function bind(id,k,fn){let e=document.getElementById(id);let d=(ev)=>{ev.preventDefault();if(k)key[k]=1;if(fn)fn()};let u=()=>{if(k)key[k]=0};e.addEventListener('touchstart',d,{passive:false});e.addEventListener('touchend',u);e.addEventListener('mousedown',d);e.addEventListener('mouseup',u)}
bind('L','l');bind('R','r');bind('U','u');bind('D','d');bind('P',null,()=>doHit(red,blue,'p'));bind('K',null,()=>doHit(red,blue,'k'));
reset();loop();
</script>
</body>
</html>
