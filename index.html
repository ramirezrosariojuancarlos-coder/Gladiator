<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gladiador Fixed 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#000;height:100vh;display:flex;flex-direction:column;font-family:Arial}
#bar{height:52px;background:#111;border-bottom:2px solid gold;display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.hp{height:14px;background:#333;border-radius:7px;overflow:hidden;width:110px;border:1px solid gold;margin-top:2px}
.hp div{height:100%} #r div{background:red} #b div{background:#00aaff}
#arena{flex:1;position:relative;background:#2a1200}
canvas{width:100%;height:100%;display:block}
#ctrl{position:absolute;bottom:0;left:0;right:0;height:135px;background:linear-gradient(0deg,#000 80%,transparent);display:flex;justify-content:space-between;padding:8px}
.btn{width:56px;height:56px;background:#222;border:2px solid gold;border-radius:12px;color:gold;display:flex;align-items:center;justify-content:center;font-size:22px}
.btn:active{background:gold;color:#000}
.big{width:78px;height:78px;flex-direction:column;font-size:20px;border-color:red;background:#331111}
.big:nth-child(2){border-color:orange;background:#332200}
</style>
</head>
<body>
<div id="bar">
<div><b style="color:red;font-size:12px">ROJO TU</b><div class="hp" id="r"><div id="hR" style="width:100%"></div></div></div>
<div style="background:gold;color:#000;padding:3px 10px;border-radius:12px;font-weight:900;font-size:12px" id="lv">NIVEL 1</div>
<div style="text-align:right"><b style="color:#44aaff;font-size:12px">ENEMIGO AZUL</b><div class="hp" id="b"><div id="hB" style="width:100%"></div></div></div>
</div>
<div id="arena"><canvas id="c"></canvas>
<div id="ctrl">
<div style="display:flex;gap:6px;align-items:flex-end"><div class="btn" id="L">◀</div><div style="display:flex;flex-direction:column;gap:6px"><div class="btn" id="U">▲</div><div class="btn" id="D">▼</div></div><div class="btn" id="R">▶</div></div>
<div style="display:flex;gap:8px"><div class="btn big" id="P">👊<span style="font-size:10px">GOLPE</span></div><div class="btn big" id="K">🦶<span style="font-size:10px">PATADA</span></div></div>
</div>
</div>
<script>
const can=document.getElementById('c'),ctx=can.getContext('2d');
let W,H; function resize(){W=can.width=can.clientWidth;H=can.height=can.clientHeight;}
resize(); window.onresize=resize;
let lvl=1;
let red={x:90,y:0,hp:100,max:100,vx:0,f:1,a:0,h:0};
let blue={x:220,y:0,hp:100,max:100,vx:0,f:-1,a:0,ai:0,h:0};
let parts=[],keys={};

function reset(){
W=can.clientWidth; H=can.clientHeight;
red.x=Math.floor(W*0.30); blue.x=Math.floor(W*0.70);
red.y=blue.y=0; red.max=100+lvl*10; red.hp=red.max; blue.max=80+lvl*15; blue.hp=blue.max;
document.getElementById('hR').style.width='100%';document.getElementById('hB').style.width='100%';
document.getElementById('lv').innerText='NIVEL '+lvl;
}
function upd(){document.getElementById('hR').style.width=Math.max(0,red.hp/red.max*100)+'%';document.getElementById('hB').style.width=Math.max(0,blue.hp/blue.max*100)+'%';}
function hit(at,de,t){
if(at.a>0)return;at.a=t=='k'?28:18;
setTimeout(()=>{if(Math.abs(at.x-de.x)<100){let d=t=='k'?20:13;de.hp-=d;de.h=12;de.vx+=at.f*8;upd();if(de.hp<=0){if(de==blue){lvl++;if(lvl>5){alert('¡CAMPEON!');lvl=1}reset()}else{lvl=1;reset()}}}},t=='k'?170:90);
}
function loop(){
requestAnimationFrame(loop);
red.vx*=0.8; if(keys.l){red.vx=-4;red.f=-1} if(keys.r){red.vx=4;red.f=1}
if(keys.u)red.y=Math.max(-60,red.y-3); if(keys.d)red.y=Math.min(20,red.y+3);
red.x+=red.vx;
blue.ai--; if(blue.ai<=0){let diff=red.x-blue.x;if(Math.abs(diff)<90){hit(blue,red,Math.random()<0.5?'p':'k')}else{blue.vx=Math.sign(diff)*1.5} blue.ai=40+Math.random()*40}
blue.vx*=0.85; blue.x+=blue.vx; blue.f=red.x>blue.x?1:-1;
if(red.a>0)red.a--; if(blue.a>0)blue.a--; if(red.h>0)red.h--; if(blue.h>0)blue.h--;
red.x=Math.max(30,Math.min(W-30,red.x)); blue.x=Math.max(30,Math.min(W-30,blue.x));

ctx.clearRect(0,0,W,H);
ctx.fillStyle='#1a0a00'; ctx.fillRect(0,0,W,H);
ctx.fillStyle='#e8c87a'; ctx.fillRect(0,H*0.65,W,H*0.35);
ctx.fillStyle='#c8a45a'; for(let i=0;i<W;i+=60)ctx.fillRect(i,H*0.65,30,4);

function draw(f,isRed){
ctx.save(); ctx.translate(f.x, H*0.65+f.y); ctx.scale(f.f,1);
if(f.h%2==0){}else ctx.globalAlpha=0.3;
ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(0,40,20,6,0,0,6.28); ctx.fill();
ctx.fillStyle=isRed?'#900':'#002a80'; ctx.fillRect(-18,0,16,30); ctx.fillRect(2,0,16,30);
ctx.fillStyle=isRed?'#ff0000':'#0055ff'; ctx.fillRect(-20,-40,40,40);
ctx.fillStyle='#888'; ctx.fillRect(-16,-62,32,24);
ctx.fillStyle='#ffdbac'; ctx.fillRect(-10,-48,20,12);
let ax=f.a>10?28:10; ctx.fillStyle='#ffdbac'; ctx.fillRect(ax,-32,f.a>10?32:16,10);
if(f.a>10){ctx.fillStyle=isRed?'#ff3300':'#00aaff'; ctx.beginPath(); ctx.arc(ax+32,-27,11,0,6.28); ctx.fill()}
ctx.restore();
}
draw(blue,false); draw(red,true);
}
function bind(id,k,fn){let el=document.getElementById(id);let d=e=>{e.preventDefault();if(k)keys[k]=1;if(fn)fn()};let u=()=>{if(k)keys[k]=0};el.addEventListener('touchstart',d,{passive:false});el.addEventListener('touchend',u);el.addEventListener('mousedown',d);el.addEventListener('mouseup',u)}
bind('L','l');bind('R','r');bind('U','u');bind('D','d');bind('P',null,()=>hit(red,blue,'p'));bind('K',null,()=>hit(red,blue,'k'));
reset(); loop();
</script>
</body>
</html>
